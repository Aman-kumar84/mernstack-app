apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: three-tier
  labels:
    role: frontend
    env: demo

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%

  selector:
    matchLabels:
      role: frontend

  template:
    metadata:
      labels:
        role: frontend

    spec:
      containers:
        - name: frontend
          image: public.ecr.aws/l7y7i8d5/three-frontend:latest
          imagePullPolicy: Always
          env:
            - name: REACT_APP_BACKEND_URL
              value: amansapplictonchecks.duckdns.org 

          ports:
            - containerPort: 3000
