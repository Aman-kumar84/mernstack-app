apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
  namespace: three-tier
  labels:
    role: api
    env: demo

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%

  selector:
    matchLabels:
      role: api

  template:
    metadata:
      labels:
        role: api

    spec:
      imagePullSecrets:
        - name: ecr-registry-secret

      containers:
        - name: api
          image: public.ecr.aws/l7y7i8d5/three-backend:latest
          imagePullPolicy: Always

          env:
            - name: MONGO_URI
              value: mongodb://mongodb-svc:27017/todo?directConnection=true

            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-sec
                  key: username

            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-sec
                  key: password

          ports:
            - containerPort: 5000

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
